    <script>
        // Ekranın uyku moduna geçmesini engelleyen API
        if ('wakeLock' in navigator) {
            let wakeLock = null;
            async function requestWakeLock() {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {}
            }
            requestWakeLock();
            document.addEventListener('visibilitychange', () => {
                if (wakeLock !== null && document.visibilityState === 'visible') {
                    requestWakeLock();
                }
            });
        }

        const colorPalette = [
            { r: 255, g: 0, b: 0, hex: '#ff0000' },
            { r: 255, g: 235, b: 0, hex: '#ffeb00' },
            { r: 0, g: 128, b: 255, hex: '#0080ff' },
            { r: 255, g: 105, b: 180, hex: '#ff69b4' },
            { r: 0, g: 255, b: 128, hex: '#00ff80' },
            { r: 255, g: 128, b: 0, hex: '#ff8000' },
            { r: 0, g: 51, b: 153, hex: '#003399' },
            { r: 139, g: 69, b: 19, hex: '#8b4513' },
            { r: 75, g: 37, b: 10, hex: '#4b250a' },
            { r: 160, g: 32, b: 240, hex: '#a020f0' }
        ];

        let isRgbActive = false;
        let colorIndex = 0;
        let transitionDuration = 2500;
        let currentStaticColor = '#ffffff';
        let animationFrameId = null;

        const clockDisplay = document.getElementById('clockDisplay');
        const ampmDisplay = document.getElementById('ampmDisplay');
        const dateDisplay = document.getElementById('dateDisplay');
        const timezoneDisplay = document.getElementById('timezoneDisplay');
        const locationBadge = document.getElementById('locationBadge');
        const ambientBg = document.getElementById('ambientBg');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const soundBtn = document.getElementById('soundBtn');
        const soundIcon = document.getElementById('soundIcon');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeModal = document.getElementById('closeModal');
        const speedSelect = document.getElementById('speedSelect');
        const formatSelect = document.getElementById('formatSelect');
        const glowRange = document.getElementById('glowRange');
        const rgbToggle = document.getElementById('rgbToggle');
        const solidColorContainer = document.getElementById('solidColorContainer');
        const rgbSpeedContainer = document.getElementById('rgbSpeedContainer');
        const colorButtons = document.querySelectorAll('#colorButtons button');
        const citySelect = document.getElementById('citySelect');
        const fontStyleSelect = document.getElementById('fontStyleSelect');

        let is24Hour = true;
        let soundEnabled = false;

        let audioCtx = null;
        function playTickSound() {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.04);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch(e) {}
        }

        let lastSecond = -1;
        function updateClock() {
            const now = new Date();
            const h = now.getHours();
            const m = now.getMinutes();
            const s = now.getSeconds();

            if (s !== lastSecond) {
                if (lastSecond !== -1) playTickSound();
                lastSecond = s;
            }

            let displayH = h;
            if (!is24Hour) {
                const ampm = h >= 12 ? 'PM' : 'AM';
                ampmDisplay.textContent = ampm;
                ampmDisplay.classList.remove('hidden');
                displayH = h % 12 || 12;
            } else {
                ampmDisplay.classList.add('hidden');
            }

            clockDisplay.textContent = `${String(displayH).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            
            const options = { day: 'numeric', month: 'long', year: 'numeric', weekday: 'long' };
            dateDisplay.textContent = now.toLocaleDateString('tr-TR', options);
        }

        setInterval(updateClock, 200);
        updateClock();

        // Şehir Değişimi
        citySelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === 'bursa:nilüfer') {
                locationBadge.textContent = 'bursa:nilüfer:saati';
            } else {
                // Şehir ismini düzenle (örn: ankara -> ankara:saati)
                locationBadge.textContent = `${val}:saati`;
            }
        });

        // Font / Saat Şekli Değişimi
        fontStyleSelect.addEventListener('change', (e) => {
            clockDisplay.className = `${e.target.value} font-black tracking-wider text-center select-none transition-colors duration-500`;
            // Stil değiştiğinde rengi koru
            if (!isRgbActive) {
                clockDisplay.style.color = currentStaticColor;
            }
        });

        function setStaticColor(hexColor) {
            currentStaticColor = hexColor;
            clockDisplay.style.color = hexColor;
            let r = parseInt(hexColor.slice(1,3), 16);
            let g = parseInt(hexColor.slice(3,5), 16);
            let b = parseInt(hexColor.slice(5,7), 16);
            ambientBg.style.background = `radial-gradient(circle at 50% 50%, rgba(${r}, ${g}, ${b}, 0.35), transparent 70%)`;
        }

        colorButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                setStaticColor(btn.getAttribute('data-color'));
            });
        });

        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        function runColorTransition() {
            if (!isRgbActive) return;

            const c1 = colorPalette[colorIndex];
            const c2 = colorPalette[(colorIndex + 1) % colorPalette.length];
            
            let startTime = null;

            function step(timestamp) {
                if (!isRgbActive) return;
                if (!startTime) startTime = timestamp;
                let progress = (timestamp - startTime) / transitionDuration;
                if (progress > 1) progress = 1;

                const r = Math.round(lerp(c1.r, c2.r, progress));
                const g = Math.round(lerp(c1.g, c2.g, progress));
                const b = Math.round(lerp(c1.b, c2.b, progress));

                const rgbString = `${r}, ${g}, ${b}`;
                clockDisplay.style.color = `rgb(${rgbString})`;
                ambientBg.style.background = `radial-gradient(circle at 50% 50%, rgba(${rgbString}, 0.4), rgba(${255 - r}, ${255 - g}, ${255 - b}, 0.1), transparent 70%)`;

                if (progress < 1) {
                    animationFrameId = requestAnimationFrame(step);
                } else {
                    colorIndex = (colorIndex + 1) % colorPalette.length;
                    setTimeout(runColorTransition, 100);
                }
            }

            animationFrameId = requestAnimationFrame(step);
        }

        rgbToggle.addEventListener('change', (e) => {
            isRgbActive = e.target.checked;
            if (isRgbActive) {
                solidColorContainer.classList.add('hidden');
                rgbSpeedContainer.classList.remove('hidden');
                runColorTransition();
            } else {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                solidColorContainer.classList.remove('hidden');
                rgbSpeedContainer.classList.add('hidden');
                setStaticColor(currentStaticColor);
            }
        });

        setStaticColor('#00ff80');

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>`;
                soundBtn.classList.add('bg-zinc-800', 'text-emerald-400');
            } else {
                soundIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>`;
                soundBtn.classList.remove('bg-zinc-800', 'text-emerald-400');
            }
        });

        settingsBtn.addEventListener('click', () => settingsModal.classList.remove('hidden'));
        closeModal.addEventListener('click', () => settingsModal.classList.add('hidden'));
        settingsModal.addEventListener('click', (e) => { if (e.target === settingsModal) settingsModal.classList.add('hidden'); });

        speedSelect.addEventListener('change', (e) => {
            transitionDuration = parseInt(e.target.value);
        });

        formatSelect.addEventListener('change', (e) => {
            is24Hour = e.target.value === '24';
        });

        glowRange.addEventListener('input', (e) => {
            ambientBg.style.opacity = e.target.value / 100;
        });
    </script>
</body>
</html>
